input {
  # Kafka에서 메트릭 수신
  kafka {
    bootstrap_servers => "kafka1:9092,kafka2:9092,kafka3:9092"
    topics => ["metrics-system", "metrics-app", "metrics-db"]
    group_id => "logstash-indexer-group"
    codec => json
    consumer_threads => 3
    decorate_events => true
    auto_offset_reset => "latest"
  }
}

filter {
  # Kafka 메타데이터 처리
  mutate {
    add_field => {
      "kafka_topic" => "%{[@metadata][kafka][topic]}"
      "kafka_partition" => "%{[@metadata][kafka][partition]}"
      "kafka_offset" => "%{[@metadata][kafka][offset]}"
      "indexer_timestamp" => "%{@timestamp}"
    }
  }
  
  # 인덱스 이름 생성
  ruby {
    code => "
      event.set('index_date', event.get('@timestamp').time.strftime('%Y.%m.%d'))
    "
  }
  
  if [index_suffix] {
    mutate {
      add_field => { 
        "target_index" => "logstash-%{[index_suffix]}-%{[index_date]}"
      }
    }
  } else {
    mutate {
      add_field => { 
        "target_index" => "logstash-default-%{[index_date]}"
      }
    }
  }
  
  # 데이터 enrichment
  if [metric_category] == "infrastructure" {
    # 시스템 메트릭 보강
    if [cpu_usage] > 80 {
      mutate {
        add_tag => [ "high_cpu" ]
        add_field => { "severity" => "warning" }
      }
    }
    if [cpu_usage] > 95 {
      mutate {
        update => { "severity" => "critical" }
      }
    }
    
    if [memory_usage] > 85 {
      mutate {
        add_tag => [ "high_memory" ]
        add_field => { "severity" => "warning" }
      }
    }
    
    if [disk_usage] > 90 {
      mutate {
        add_tag => [ "high_disk" ]
        update => { "severity" => "critical" }
      }
    }
  }
  
  if [metric_category] == "application" {
    # 애플리케이션 메트릭 보강
    if [error_rate] > 0.05 {
      mutate {
        add_tag => [ "high_error_rate" ]
        add_field => { "severity" => "warning" }
      }
    }
    
    if [response_time] {
      ruby {
        code => "
          rt = event.get('response_time').to_f
          if rt < 100
            event.set('performance_tier', 'excellent')
          elsif rt < 500
            event.set('performance_tier', 'good')
          elsif rt < 1000
            event.set('performance_tier', 'acceptable')
          elsif rt < 5000
            event.set('performance_tier', 'slow')
          else
            event.set('performance_tier', 'critical')
          end
        "
      }
    }
  }
  
  if [metric_category] == "database" {
    # 데이터베이스 메트릭 보강
    if [connection_count] > 100 {
      mutate {
        add_tag => [ "high_connections" ]
      }
    }
    
    if [replication_lag] > 1000 {
      mutate {
        add_tag => [ "replication_delayed" ]
        add_field => { "severity" => "warning" }
      }
    }
  }
  
  # 지역 정보 추가 (IP 기반)
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
      add_field => [ "[geoip][coordinates]", "%{[geoip][longitude]}" ]
      add_field => [ "[geoip][coordinates]", "%{[geoip][latitude]}" ]
    }
    mutate {
      convert => [ "[geoip][coordinates]", "float" ]
    }
  }
  
  # 데이터 품질 점수 계산
  ruby {
    code => "
      score = 100
      
      # 필수 필드 체크
      required_fields = ['@timestamp', 'metric_type', 'hostname']
      required_fields.each do |field|
        if event.get(field).nil?
          score -= 20
        end
      end
      
      # 데이터 완전성 체크
      if event.get('metric_category') == 'infrastructure'
        infra_fields = ['cpu_usage', 'memory_usage', 'disk_usage']
        infra_fields.each do |field|
          if event.get(field).nil?
            score -= 10
          end
        end
      end
      
      event.set('data_quality_score', score)
      
      if score < 60
        event.tag('low_quality_data')
      end
    "
  }
  
  # 통계 정보 추가
  metrics {
    meter => "events"
    add_tag => [ "metric" ]
    flush_interval => 60
    rates => [1, 5, 15]
  }
  
  # 로그 파일에 기록
  file {
    path => "/home/ingest/logstash-8.1.3_metric/logstash_rx_message.log"
    codec => line { 
      format => "%{indexer_timestamp} - Index: %{target_index} - Score: %{data_quality_score}"
    }
  }
  
  # 최종 정리
  mutate {
    remove_field => [ 
      "kafka_topic", 
      "kafka_partition", 
      "kafka_offset", 
      "index_date", 
      "indexer_timestamp",
      "@metadata"
    ]
  }
}

output {
  # OpenSearch로 인덱싱
  if "low_quality_data" not in [tags] {
    opensearch {
      hosts => ["opensearch-master:9200"]
      index => "%{target_index}"
      document_type => "_doc"
      manage_template => true
      template_name => "logstash"
      template => "/etc/logstash/templates/logstash.json"
      template_overwrite => true
      
      # 성능 최적화
      flush_size => 500
      idle_flush_time => 5
      
      # 재시도 설정
      retry_on_conflict => 3
      
      # 벌크 설정
      action => "index"
    }
  }
  
  # PostgreSQL에도 저장 (메타데이터)
  if [severity] == "critical" {
    jdbc {
      driver_class => "org.postgresql.Driver"
      connection_string => "jdbc:postgresql://postgres-active:5432/pipeline_db"
      username => "postgres"
      password => "postgres123"
      statement => [
        "INSERT INTO critical_metrics (timestamp, hostname, metric_type, metric_category, severity, data) 
         VALUES (?, ?, ?, ?, ?, ?::jsonb)",
        "@timestamp",
        "hostname",
        "metric_type",
        "metric_category",
        "severity",
        "%{[@metadata][raw_event]}"
      ]
    }
  }
  
  # 저품질 데이터는 별도 처리
  if "low_quality_data" in [tags] {
    file {
      path => "/var/log/logstash/low_quality_metrics_%{+YYYY.MM.dd}.log"
      codec => json_lines
    }
    
    # 재처리를 위해 Dead Letter Queue로
    opensearch {
      hosts => ["opensearch-master:9200"]
      index => "dlq-metrics-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }
  
  # 실시간 알림 (critical 이벤트)
  if [severity] == "critical" and [environment] == "production" {
    http {
      url => "http://alert-service:8080/webhook"
      http_method => "post"
      format => "json"
      mapping => {
        "severity" => "%{severity}"
        "hostname" => "%{hostname}"
        "metric_type" => "%{metric_type}"
        "message" => "Critical metric detected"
        "timestamp" => "%{@timestamp}"
      }
    }
  }
  
  # 디버깅용
  if "_debug" in [tags] {
    stdout {
      codec => rubydebug
    }
  }
}